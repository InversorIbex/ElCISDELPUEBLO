# Laboratorio exclusivamente: datos sintéticos, loopback, sin volumen persistente.
# docker compose -f compose.test.yml up -d
# TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/cis_pueblo_test npm run test:integration
# docker compose -f compose.test.yml down
services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: cis_pueblo_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cis_pueblo_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 384m
