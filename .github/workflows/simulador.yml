name: Simulador modo demostración
# Llama cada 5 minutos a /api/cron/simular. El endpoint solo actúa si en
# Vercel SIMULATION_ENABLED=true; los votos se guardan como SIMULADOS y la web
# lo anuncia. Requiere el secreto de repositorio CRON_SECRET (el mismo valor
# que en Vercel). GitHub puede retrasar las ejecuciones programadas unos minutos.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulador
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ejecutar simulador
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.laopiniondelpueblo.eu' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET no configurado: nada que hacer"; exit 0; fi
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/simular")
          cat resp.json; echo
          # 409 = simulación desactivada en Vercel (no es un error).
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then exit 1; fi
